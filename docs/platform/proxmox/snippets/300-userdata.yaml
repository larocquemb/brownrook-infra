#cloud-config
hostname: k3s1
fqdn: k3s1.brownrook.net
manage_etc_hosts: false

users:
  - name: paul
    groups: [wheel]
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    shell: /bin/bash
    lock_passwd: false
    ssh_authorized_keys:
      - "ssh-rsa  paul@Pauls-Mac-mini"

ssh_pwauth: true
chpasswd:
  list: |
    root:brownrook
    paul:brownrook
  expire: false

write_files:
  - path: /etc/ssh/sshd_config.d/99-brownrook.conf
    permissions: "0644"
    content: |
      PasswordAuthentication yes
      KbdInteractiveAuthentication yes
      PermitRootLogin no

runcmd:
  - rm -f /etc/ssh/sshd_config.d/50-cloud-init.conf
  - ssh-keygen -A
  - systemctl enable --now sshd
  - systemctl restart sshd

final_message: "cloud-init complete"

