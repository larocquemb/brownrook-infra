apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-config
  namespace: argocd
spec:
  project: brownrook
  source:
    repoURL: https://github.com/larocquemb/brownrook-infra.git
    targetRevision: main
    path: kubernetes/platform/traefik
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
