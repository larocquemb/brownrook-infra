apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
data:
  url: https://argocd.idc.brownrook.com
  oidc.config: |
    name: Microsoft Entra ID
    issuer: https://login.microsoftonline.com/8b07f4bd-41e4-4106-8d49-00c5d79d35a2/v2.0
    clientID: c563315a-a8cb-4d80-85b8-e57bcb21b35a
    clientSecret: $oidc.azure.clientSecret
    requestedIDTokenClaims:
      groups:
        essential: true
        value: ApplicationGroup
    requestedScopes:
      - openid
      - profile
      - email
  timeout.reconciliation: 30s
  timeout.reconciliation.jitter: 0s
  # Argo CD 3 excludes EndpointSlice by default. Keep the other low-value,
  # high-churn resources excluded while allowing the explicitly Git-managed
  # home-budget external-service EndpointSlice.
  resource.exclusions: |
    - apiGroups:
        - ''
      kinds:
        - Endpoints
    - apiGroups:
        - coordination.k8s.io
      kinds:
        - Lease
    - apiGroups:
        - authentication.k8s.io
        - authorization.k8s.io
      kinds:
        - SelfSubjectReview
        - TokenReview
        - LocalSubjectAccessReview
        - SelfSubjectAccessReview
        - SelfSubjectRulesReview
        - SubjectAccessReview
    - apiGroups:
        - certificates.k8s.io
      kinds:
        - CertificateSigningRequest
    - apiGroups:
        - cert-manager.io
      kinds:
        - CertificateRequest
    - apiGroups:
        - cilium.io
      kinds:
        - CiliumIdentity
        - CiliumEndpoint
        - CiliumEndpointSlice
    - apiGroups:
        - kyverno.io
        - reports.kyverno.io
        - wgpolicyk8s.io
      kinds:
        - PolicyReport
        - ClusterPolicyReport
        - EphemeralReport
        - ClusterEphemeralReport
        - AdmissionReport
        - ClusterAdmissionReport
        - BackgroundScanReport
        - ClusterBackgroundScanReport
        - UpdateRequest
