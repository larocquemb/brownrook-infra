apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: brownrook-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/larocquemb/brownrook-infra.git
    targetRevision: main
    path: kubernetes/gitops
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

