apiVersion: v1
kind: Secret
metadata:
  name: k3s-etcd-snapshot-s3-config
  namespace: kube-system
type: etcd.k3s.cattle.io/s3-config-secret
stringData:
  etcd-s3-endpoint: REPLACE_WITH_S3_ENDPOINT
  etcd-s3-skip-ssl-verify: "false"
  etcd-s3-access-key: REPLACE_FROM_SECRET_MANAGER
  etcd-s3-secret-key: REPLACE_FROM_SECRET_MANAGER
  etcd-s3-bucket: REPLACE_WITH_BACKUP_BUCKET
  etcd-s3-folder: k3s/etcd
  etcd-s3-region: REPLACE_WITH_REGION
  etcd-s3-insecure: "false"
  etcd-s3-timeout: 5m
