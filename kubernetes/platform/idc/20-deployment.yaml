apiVersion: apps/v1
kind: Deployment
metadata:
  name: brownrook-idc
  namespace: brownrook-idc
  labels:
    app: brownrook-idc
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: brownrook-idc
  template:
    metadata:
      labels:
        app: brownrook-idc
    spec:
      terminationGracePeriodSeconds: 45    
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        runAsNonRoot: true
      containers:
        - name: brownrook-idc
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]
          image: ghcr.io/larocquemb/brownrook-idc:9fd2adab6ca98f37702e16e9ea24dd01637866d5
          imagePullPolicy: Always
          env:
            - name: APP_VERSION
              value: "0.1.1"
            - name: GIT_COMMIT
              value: "9fd2adab6ca98f37702e16e9ea24dd01637866d5"
            - name: BUILD_NUMBER
              value: "22"
            - name: IMAGE_REF
              value: "ghcr.io/larocquemb/brownrook-idc:9fd2adab6ca98f37702e16e9ea24dd01637866d5"
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: brownrook-idc-config
            - secretRef:
                name: brownrook-idc-secret
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

