apiVersion: apps/v1
kind: Deployment
metadata:
  name: brownrook-idc
  namespace: brownrook-idc
  labels:
    app: brownrook-idc
  annotations:
    brownrook.com/app-version: "0.1.18"
    brownrook.com/git-commit: "4c1003587986e9a1d2a5f105e08dffbd270b0bf1"
    brownrook.com/build-number: "43"    
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: brownrook-idc
  template:
    metadata:
      labels:
        app: brownrook-idc
      annotations:
        brownrook.com/app-version: "0.1.18"
        brownrook.com/git-commit: "4c1003587986e9a1d2a5f105e08dffbd270b0bf1"
        brownrook.com/build-number: "43"        
    spec:
      terminationGracePeriodSeconds: 45    
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        runAsNonRoot: true
      containers:
        - name: brownrook-idc
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]
          image: ghcr.io/larocquemb/brownrook-idc:7804917e48454399e2db828dae7a0abb80f6e015
          imagePullPolicy: Always
          env:
            - name: APP_VERSION
              value: "0.1.18"
            - name: GIT_COMMIT
              value: "7804917e48454399e2db828dae7a0abb80f6e015"
            - name: BUILD_NUMBER
              value: "45"
            - name: DEPLOYMENT_PROFILE
              value: "sandbox"
            - name: IMAGE_REF
              value: "ghcr.io/larocquemb/brownrook-idc:7804917e48454399e2db828dae7a0abb80f6e015"
            - name: CLUSTER_NAME
              value: "k3s1"
            - name: KUBERNETES_VERSION
              value: "v1.34.5+k3s1"
            - name: NODE_OS
              value: "Red Hat Enterprise Linux 10.1 (Coughlan)"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: brownrook-idc-config
            - secretRef:
                name: brownrook-idc-secret
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

