apiVersion: v1
kind: Service
metadata:
  name: ledger-dev
  namespace: brownrook-idc
spec:
  type: ExternalName
  externalName: m4pro.brownrook.net
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ledger-dev
  namespace: brownrook-idc
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - idc.brownrook.net
      secretName: idc-brownrook-net-tls
  rules:
    - host: idc.brownrook.net
      http:
        paths:
          - path: /ledger
            pathType: Prefix
            backend:
              service:
                name: ledger-dev
                port:
                  number: 8080
