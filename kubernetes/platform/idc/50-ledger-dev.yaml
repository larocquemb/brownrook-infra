apiVersion: v1
kind: Service
metadata:
  name: ledger-dev
  namespace: brownrook-idc
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Endpoints
metadata:
  name: ledger-dev
  namespace: brownrook-idc
subsets:
  - addresses:
      - ip: 192.168.2.10
    ports:
      - name: http
        protocol: TCP
        port: 8080
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ledger-dev-brownrook-net-tls
  namespace: brownrook-idc
spec:
  secretName: ledger-dev-brownrook-net-tls
  issuerRef:
    name: letsencrypt-prod-route53
    kind: ClusterIssuer
  dnsNames:
    - ledger-dev.brownrook.net
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ledger-dev
  namespace: brownrook-idc
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ledger-dev.brownrook.net
      secretName: ledger-dev-brownrook-net-tls
  rules:
    - host: ledger-dev.brownrook.net
      http:
        paths:
          - path: /ledger
            pathType: Prefix
            backend:
              service:
                name: ledger-dev
                port:
                  number: 8080
