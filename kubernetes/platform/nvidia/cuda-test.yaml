apiVersion: v1
kind: Pod
metadata:
  name: cuda-test
spec:
  restartPolicy: Never
  runtimeClassName: nvidia
  nodeSelector:
    kubernetes.io/hostname: arsene
  containers:
    - name: cuda-test
      image: registry.redhat.io/rhai/base-image-cuda-13.0-rhel9@sha256:50c435bc8aa6011077a326627f496f82ce4b752f04b67aa68f74469871efb53f
      command: ["nvidia-smi"]
      resources:
        limits:
          nvidia.com/gpu: 1
