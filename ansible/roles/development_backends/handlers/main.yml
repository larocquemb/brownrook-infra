---
- name: Restart development access restrictions
  ansible.builtin.systemd_service:
    name: brownrook-development-access.service
    daemon_reload: true
    state: restarted

- name: Restart development backends
  become: true
  become_user: "{{ development_backends_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ development_backends_account.uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ development_backends_account.uid }}/bus"
  ansible.builtin.systemd_service:
    scope: user
    daemon_reload: true
    name: "brownrook-dev-{{ item }}.service"
    state: restarted
  loop: "{{ development_backends_services }}"
