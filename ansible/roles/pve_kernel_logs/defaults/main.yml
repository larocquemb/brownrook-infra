---
pve_kernel_logs_alloy_version: 1.20.1-1
pve_kernel_logs_loki_url: https://monitoring.idc.brownrook.net:3100/loki/api/v1/push
pve_kernel_logs_loki_hostname: monitoring.idc.brownrook.net
pve_kernel_logs_max_age: 48h
pve_kernel_logs_pki_dir: "{{ lookup('ansible.builtin.env', 'BROWNROOK_PKI_DIR') | default(lookup('ansible.builtin.env', 'HOME') ~ '/brownrook-ca', true) }}"
pve_kernel_logs_ca_source: "{{ pve_kernel_logs_pki_dir }}/root/root_ca.crt"
pve_kernel_logs_cert_source: "{{ pve_kernel_logs_pki_dir }}/leafs/alloy-loki-client/alloy-loki-client.fullchain.crt"
pve_kernel_logs_key_source: "{{ pve_kernel_logs_pki_dir }}/leafs/alloy-loki-client/alloy-loki-client.key"
