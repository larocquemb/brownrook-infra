---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart node_exporter firewall
  ansible.builtin.systemd_service:
    name: brownrook-node-exporter-firewall.service
    state: restarted

- name: Restart node_exporter
  ansible.builtin.systemd_service:
    name: node_exporter.service
    state: restarted
