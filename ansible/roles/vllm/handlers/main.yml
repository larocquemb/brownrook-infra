---
- name: Reload systemd for vLLM
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: not ansible_check_mode

- name: Restart vLLM access
  ansible.builtin.systemd_service:
    name: vllm-access.service
    daemon_reload: true
    enabled: true
    state: restarted
  when: not ansible_check_mode
