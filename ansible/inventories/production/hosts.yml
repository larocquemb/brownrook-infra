---
all:
  vars:
    ansible_user: paul
  children:
    k3s_nodes:
      hosts:
        k3s1:
          ansible_host: k3s1.brownrook.net
          node_exporter_listen_address: "0.0.0.0:9100"
          node_exporter_allowed_source: "192.168.2.202"
    monitoring_servers:
      hosts:
        monitoring:
          ansible_host: "192.168.2.202"
    jupyter:
      children:
        jupyter_servers:
          hosts:
            arsene:
              ansible_host: 192.168.2.201
        jupyter_proxies:
          hosts:
            proxy:
              ansible_host: 192.168.2.210
              ansible_user: root
              ansible_become: false
        jupyter_dns_servers:
          hosts:
            dns1:
              ansible_host: 192.168.2.252
              ansible_user: root
              ansible_become: false
    kernel_log_servers:
      hosts:
        pve:
          ansible_host: 192.168.2.200
          ansible_user: root
          ansible_become: false
