---
jupyter_user: paul
jupyter_group: paul
jupyter_home: /home/paul
jupyter_hostname: jupyter.idc.brownrook.com
jupyter_backend_ip: 192.168.2.201
jupyter_backend_port: 8888
jupyter_ollama_url: http://192.168.2.201:11434
jupyter_proxy_ip: 192.168.2.210
jupyter_notebooks_dir: /home/paul/notebooks
jupyter_uv_version: 0.13.0
jupyter_gpu_python_version: 3.15.0
jupyter_server_python: /usr/bin/python3.12
jupyter_uv_binary: /home/paul/venvs/python-tools/bin/uv
jupyter_projects_dir: /home/paul/.local/share/brownrook/jupyter-envs
jupyter_certificate: /etc/letsencrypt/live/idc.brownrook.com/fullchain.pem
jupyter_certificate_key: /etc/letsencrypt/live/idc.brownrook.com/privkey.pem

# Internal alias uses the existing Brownrook CA, not the public wildcard.
jupyter_internal_hostname: jupyter.idc.brownrook.net
jupyter_internal_allowed_sources: [192.168.2.0/24, 10.6.0.0/24]
jupyter_pki_dir: "{{ lookup('ansible.builtin.env', 'BROWNROOK_PKI_DIR') | default(lookup('ansible.builtin.env', 'HOME') ~ '/brownrook-ca', true) }}"
jupyter_internal_certificate_source: "{{ jupyter_pki_dir }}/leafs/k3ingress/k3ingress.fullchain.crt"
jupyter_internal_key_source: "{{ jupyter_pki_dir }}/leafs/k3ingress/k3ingress.key"
jupyter_internal_ca_source: "{{ jupyter_pki_dir }}/root/root_ca.crt"
jupyter_internal_certificate: /etc/nginx/tls/jupyter-arsene/fullchain.crt
jupyter_internal_key: /etc/nginx/tls/jupyter-arsene/privkey.pem
jupyter_internal_ca: /etc/nginx/tls/jupyter-arsene/root-ca.crt
