---
- name: Remove K3s targets and dashboard from the monitoring server
  hosts: monitoring_servers
  become: true
  gather_facts: true
  vars:
    monitoring_server_state: absent
  roles:
    - role: monitoring_server

- name: Remove node_exporter from K3s nodes
  hosts: k3s_nodes
  become: true
  gather_facts: true
  vars:
    node_exporter_state: absent
  roles:
    - role: node_exporter
