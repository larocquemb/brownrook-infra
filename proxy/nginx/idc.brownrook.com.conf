server {
    listen 443 ssl;
    server_name idc.brownrook.com;

    ssl_certificate     /etc/letsencrypt/live/idc.brownrook.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/idc.brownrook.com/privkey.pem;

    location / {
        proxy_pass http://192.168.2.240:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
