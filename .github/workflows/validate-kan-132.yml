name: Validate KAN-132 assets

on:
  pull_request:
    paths:
      - ".github/workflows/validate-kan-132.yml"
      - "docs/kan-132/**"
      - "scripts/kan-132/**"
      - "tests/kan132/**"
      - "Makefile"
      - "kubernetes/staged/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/validate-kan-132.yml"
      - "docs/kan-132/**"
      - "scripts/kan-132/**"
      - "tests/kan132/**"
      - "Makefile"
      - "kubernetes/staged/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install validation tools
        run: python -m pip install pytest
      - name: Validate scripts and read-only API failure cases
        run: make ha-check
      - name: Exercise the root-only backup against isolated synthetic files
        run: sudo "$(command -v python)" -m pytest -q tests/kan132/test_sqlite_backup.py

      - name: Reject unresolved conflict markers and committed credentials
        run: |
          ! grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' \
            docs/kan-132 scripts/kan-132 kubernetes/staged
          ! grep -R -n -E '(AKIA[0-9A-Z]{16}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' \
            docs/kan-132 scripts/kan-132 kubernetes/staged

      - name: Confirm production manifests are still staged
        run: |
          ! grep -R -n 'staged/longhorn' kubernetes/gitops/kustomization.yaml
          grep -q 'targetRevision: 1.12.1' kubernetes/staged/longhorn/application.yaml
          grep -q 'numberOfReplicas: "3"' kubernetes/staged/longhorn/storage-classes.yaml
