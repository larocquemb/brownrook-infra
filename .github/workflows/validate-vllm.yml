---
name: Validate vLLM infrastructure
on:
  pull_request:
    paths: ["ansible/**", "scripts/vllm/**", "tests/vllm/**", ".github/workflows/validate-vllm.yml"]
  push:
    branches: [main]
    paths: ["ansible/**", "scripts/vllm/**", "tests/vllm/**", ".github/workflows/validate-vllm.yml"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt pytest
      - run: ansible-lint ansible/playbooks/vllm.yml
      - run: ansible-playbook --syntax-check ansible/playbooks/vllm.yml
      - run: python -m pytest -q tests/vllm
      - run: sudo apt-get update && sudo apt-get install -y nftables
      - run: python scripts/vllm/render_templates.py /tmp/vllm-rendered
      - run: sudo nft --check --file /tmp/vllm-rendered/vllm-access.nft
      - run: systemd-analyze verify /tmp/vllm-rendered/brownrook-vllm.service /tmp/vllm-rendered/vllm-access.service
