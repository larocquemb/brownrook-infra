---
name: Validate database storage playbooks
on:
  pull_request:
    paths: ['ansible/roles/*data*/**', 'ansible/roles/pve_data_disk/**', 'ansible/playbooks/database-storage-*.yml', 'ansible/collections/**', 'Makefile', '.github/workflows/validate-database-storage.yml']
  push:
    branches: [main]
    paths: ['ansible/roles/*data*/**', 'ansible/roles/pve_data_disk/**', 'ansible/playbooks/database-storage-*.yml', 'ansible/collections/**', 'Makefile', '.github/workflows/validate-database-storage.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: make storage-check
