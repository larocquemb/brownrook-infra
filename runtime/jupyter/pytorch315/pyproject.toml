[project]
name = "brownrook-arsene-pytorch315"
version = "1.0.0"
requires-python = ">=3.15,<3.16"
dependencies = [
  "torch==2.14.1",
  "torchvision==0.29.1",
  "ipykernel",
  "numpy==2.5.4",
  "filelock==4.1.0",
  "MarkupSafe==3.0.4",
  "mpmath==1.3.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
